<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>claude golden-eye</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="brand"><span class="eye">◉</span> claude golden-eye</div>
    <div class="conn"><span id="conn-dot" class="dot off"></span><span id="conn-label">connecting…</span></div>
  </header>
  <nav id="session-chips" aria-label="sessions"></nav>
  <main>
    <section class="col-left">
      <div id="mission" class="card" aria-label="mission"></div>
      <div id="plan" class="card" aria-label="plan board"></div>
      <div id="discipline" class="card" aria-label="discipline"></div>
    </section>
    <section class="col-right">
      <div id="agents" class="card" aria-label="agent tree"></div>
      <div id="timeline" class="card" aria-label="event timeline"></div>
    </section>
  </main>
  <footer><span id="foot"></span></footer>
  <script src="/app.js"></script>
</body>
</html>
