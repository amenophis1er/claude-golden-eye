name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release
  id-token: write # npm trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: npm install
      - run: npm test
      # Publishes via npm trusted publishing — configure this repo + workflow
      # as a Trusted Publisher in the package settings on npmjs.com (no token).
      - run: npm publish
      # Release notes come from CHANGELOG.md, not from the commit list: this
      # step fails when the tagged version has no section, so a release can
      # never ship without notes someone actually wrote.
      - run: scripts/changelog-section.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
        env:
          GH_TOKEN: ${{ github.token }}
